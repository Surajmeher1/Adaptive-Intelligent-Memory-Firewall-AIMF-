# Alembic configuration for AIMF
# This file is read by `alembic` commands.
# Run from the backend/ directory: alembic upgrade head

[alembic]
# Path to migration scripts
script_location = migrations

# SQLAlchemy URL — overridden by env_url in env.py
# Set AIMF_DATABASE_URL in your .env to override
sqlalchemy.url = sqlite+aiosqlite:///./aimf.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
