version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aimf_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/aimf.db:/app/aimf.db
    env_file:
      - ./backend/.env
    environment:
      - AIMF_DATABASE_URL=sqlite+aiosqlite:////app/aimf.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aimf_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
